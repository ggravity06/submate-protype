<title>SUBMATE — จัดการค่าสมัครสมาชิก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   SUBMATE — clickable prototype (DES324 pitch demo)
   Sections: 1 tokens · 2 layout/frame · 3 components · 4 screens · 5 sheets
   ===================================================================== */

/* ---------- 1. DESIGN TOKENS ---------- */
:root{
  --rose:#D0568A;        /* primary (decorative / large elements) */
  --rose-ink:#B23E75;    /* primary for CTAs & text-bearing fills (AA with white) */
  --rose-deep:#8F2C5A;   /* rose text on soft tints (AA) */
  --rose-soft:#F9DDE9;
  --teal:#42979A;        /* secondary (charts, decoration) */
  --teal-ink:#1F6A6D;    /* teal for text / filled buttons (AA) */
  --teal-soft:#D9EEEE;
  --ivory:#F3EBDE;       /* app background */
  --card:#FFFAF2;        /* card surface (ivory, a touch lighter) */
  --mint:#A8D8C0;
  --blush:#F4B6CD;
  --ink:#2B2330;
  --muted:#6A5F70;       /* secondary text, 5:1 on ivory */
  --line:rgba(43,35,48,.10);
  --danger:#B3261E;
  --danger-soft:#FBE3E1;
  --shadow:0 6px 20px rgba(43,35,48,.08),0 1px 3px rgba(43,35,48,.06);
  --shadow-lg:0 20px 50px rgba(43,35,48,.22);
  --r-card:24px;
  --font-display:'Fredoka','Prompt','Noto Sans Thai',sans-serif;
  --font-body:'Prompt','Noto Sans Thai',system-ui,sans-serif;
}

/* ---------- 2. PAGE + PHONE FRAME ---------- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:var(--font-body);color:var(--ink);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(600px 400px at 15% 10%,rgba(244,182,205,.55),transparent 70%),
    radial-gradient(600px 420px at 90% 90%,rgba(168,216,192,.6),transparent 70%),
    #EADFCB;
}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal-ink);outline-offset:2px}

.stage{width:390px;height:844px;flex:none;transform:scale(var(--scale,1));transform-origin:center center}
.phone{
  position:relative;width:390px;height:844px;background:var(--ivory);
  border-radius:44px;overflow:hidden;display:flex;flex-direction:column;isolation:isolate;
  box-shadow:0 0 0 10px #2B2330,var(--shadow-lg);
}
.statusbar{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font:600 15px var(--font-display);position:relative;z-index:3}
.statusbar .sb-right{display:flex;gap:6px;align-items:center}
.sb-batt{width:24px;height:12px;border-radius:4px;border:1.5px solid var(--ink);position:relative;padding:1px}
.sb-batt::before{content:"";display:block;height:100%;width:75%;background:var(--ink);border-radius:2px}
.sb-batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--ink);border-radius:1px}
.sb-signal{display:flex;gap:2px;align-items:flex-end;height:12px}
.sb-signal i{display:block;width:3px;background:var(--ink);border-radius:1px}

/* Real phones: full-screen, no frame */
@media (max-width:500px){
  body{background:var(--ivory)}
  .stage{width:100vw;height:100vh;height:100dvh;transform:none}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top)}
  .statusbar{display:none}
}

.main{position:relative;flex:1;min-height:0;overflow:hidden}
/* soft gradient blobs behind the header */
.blobs{position:absolute;inset:0;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(8px)}
.blob.b1{width:260px;height:260px;left:-90px;top:-110px;background:radial-gradient(circle at 40% 40%,var(--blush),rgba(244,182,205,0) 70%)}
.blob.b2{width:220px;height:220px;right:-70px;top:-60px;background:radial-gradient(circle at 50% 50%,var(--mint),rgba(168,216,192,0) 70%)}
.blob.b3{width:180px;height:180px;right:40px;top:90px;background:radial-gradient(circle,rgba(208,86,138,.22),rgba(208,86,138,0) 70%)}

.view{position:absolute;inset:0;z-index:1;overflow-x:hidden;overflow-y:auto;padding:8px 20px 120px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.view::-webkit-scrollbar{display:none}
.view.enter>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.04s}
.view.enter>*:nth-child(3){animation-delay:.08s}
.view.enter>*:nth-child(4){animation-delay:.12s}
.view.enter>*:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- 3. COMPONENTS ---------- */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px}
.press{transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
.press:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack-v>*+*{margin-top:16px}

.page-head{display:flex;align-items:center;justify-content:space-between;padding:6px 0 16px;gap:12px}
.page-head h1{font:600 28px/1.15 var(--font-display);letter-spacing:-.2px}
.page-head p{font-size:14px;color:var(--muted);margin-top:2px}
.logo{display:inline-flex;align-items:center;gap:8px;font:700 22px var(--font-display);color:var(--rose-deep)}
.logo-mark{width:36px;height:36px;border-radius:12px;display:block;object-fit:cover;box-shadow:0 4px 10px rgba(208,86,138,.35)}
.icon-btn{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px;cursor:pointer}
.icon-btn svg{width:22px;height:22px}
.dot{position:absolute;top:8px;right:9px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rose-ink);color:#fff;font:700 11px/18px var(--font-body);text-align:center}

.btn{border:0;border-radius:999px;padding:12px 20px;min-height:46px;font:700 16px var(--font-body);cursor:pointer;transition:transform .15s,filter .15s,box-shadow .15s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--rose-ink);color:#fff;box-shadow:0 6px 14px rgba(178,62,117,.32)}
.btn-teal{background:var(--teal-ink);color:#fff}
.btn-soft{background:var(--rose-soft);color:var(--rose-deep)}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn-danger{background:var(--danger);color:#fff}
.btn-link-danger{background:none;color:var(--danger);box-shadow:none}
.btn-sm{padding:8px 14px;min-height:38px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:default;box-shadow:none}

.seg{display:inline-flex;background:rgba(43,35,48,.07);border-radius:999px;padding:3px}
.seg button{white-space:nowrap;border:0;background:none;padding:8px 13px;min-height:36px;border-radius:999px;font:600 14px var(--font-body);color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--rose-deep);box-shadow:var(--shadow)}
.seg[aria-disabled="true"]{opacity:.5;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font:600 12px var(--font-body);white-space:nowrap}
.chip-rose{background:var(--rose-soft);color:var(--rose-deep)}
.chip-teal{background:var(--teal-soft);color:var(--teal-ink)}
.chip-ink{background:rgba(43,35,48,.08);color:var(--ink)}
.chip-danger{background:var(--danger-soft);color:var(--danger)}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.filter-chip{flex:none;border:0;border-radius:999px;padding:9px 16px;min-height:40px;background:var(--card);box-shadow:var(--shadow);font:600 14px var(--font-body);color:var(--ink);cursor:pointer;transition:transform .15s,background .2s}
.filter-chip:active{transform:scale(.95)}
.filter-chip[aria-pressed="true"]{background:var(--rose-ink);color:#fff}

.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c,var(--rose));color:#fff;font:600 19px var(--font-display);letter-spacing:-.3px}
.av.lg{width:52px;height:52px;font-size:22px}
.av.pastel{background:var(--c);color:var(--ink)}

.switch{position:relative;flex:none;width:52px;height:30px;border-radius:15px;border:0;background:#9A8FA0;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.3,1.3,.5,1)}
.switch[aria-checked="true"]{background:var(--teal-ink)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.section-head h2{font:600 19px var(--font-display)}

.empty{text-align:center;padding:36px 20px}
.empty-ico{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,var(--rose-soft),var(--teal-soft))}
.empty h3{font:600 20px var(--font-display);margin-bottom:6px}
.empty p{color:var(--muted);font-size:14px;margin:0 auto 16px;max-width:260px;line-height:1.5}
.empty .btn+.btn{margin-left:6px}

/* ---------- 4. SCREENS ---------- */
/* Home: total card + donut */
.total-card{position:relative;overflow:hidden}
.total-card::before{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--blush),transparent 70%);opacity:.7}
.total-card>*{position:relative}
.big{font:700 52px/1 var(--font-display);color:var(--rose-ink);margin-top:10px;letter-spacing:-1px}
.big .cur{font-size:30px;margin-right:2px;vertical-align:6px}
.big .per{font:600 16px var(--font-body);color:var(--muted);letter-spacing:0;margin-left:6px}
.donut-wrap{display:flex;align-items:center;gap:16px;margin-top:18px}
.donut{position:relative;width:128px;height:128px;flex:none}
.donut svg{width:100%;height:100%}
.donut .track{fill:none;stroke:#EFE3D1;stroke-width:6}
.donut .arc{cursor:pointer;animation:draw .9s cubic-bezier(.3,.8,.3,1) both;transform-origin:center}
@keyframes draw{from{stroke-dasharray:0 100}}
.donut-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-center b{font:700 28px/1 var(--font-display)}
.donut-center span{font-size:12px;color:var(--muted)}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.legend button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 6px;border-radius:12px;cursor:pointer;text-align:left;transition:background .15s;min-height:34px}
.legend button:active{background:rgba(43,35,48,.06)}
.legend .sw{width:12px;height:12px;border-radius:4px;flex:none}
.legend .nm{flex:1;font-size:14px;font-weight:500;white-space:nowrap}
.legend .am{font:600 14px var(--font-display)}
.legend .pc{font-size:12px;color:var(--muted);width:30px;text-align:right}

.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:4px 20px 12px;scroll-snap-type:x proximity;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.up-card{flex:none;width:158px;scroll-snap-align:start;border:0;text-align:left;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px}
.up-card .nm{font:600 15px/1.25 var(--font-body);margin-top:2px}
.up-card .pr{font:700 20px var(--font-display)}
.up-card .dt{font-size:12px;color:var(--muted)}

.banner{display:flex;gap:12px;border-radius:24px;padding:16px;background:linear-gradient(135deg,var(--blush),#F9DDE9);box-shadow:var(--shadow);margin-top:16px}
.banner .ico{font-size:30px;line-height:1}
.banner h3{font:600 16px/1.3 var(--font-body)}
.banner p{font-size:14px;margin-top:2px;line-height:1.45}
.banner .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mini{border:0;text-align:left;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px}
.mini .k{font-size:12px;color:var(--muted)}
.mini .v{font:700 22px var(--font-display);margin-top:2px}
.mini .s{font-size:12px;color:var(--teal-ink);font-weight:600;margin-top:2px}

.demo-tools{margin-top:26px;text-align:center}
.demo-tools p{font-size:12px;color:var(--muted);margin-bottom:8px}

/* Subscriptions */
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search input{width:100%;height:50px;border-radius:999px;border:2px solid transparent;background:var(--card);box-shadow:var(--shadow);padding:0 18px 0 46px;font:500 16px var(--font-body);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--teal)}
.search input::placeholder{color:#7B7080}
.sub-summary{font-size:14px;color:var(--muted);margin:10px 2px 10px}
.sub-list{display:flex;flex-direction:column;gap:10px}
.sub-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px 14px}
.sub-row .mid{flex:1;min-width:0}
.sub-row .nm{font:600 16px var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-row .meta{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sub-row .rt{text-align:right}
.sub-row .pr{font:700 18px var(--font-display)}
.sub-row .pr small{font:500 12px var(--font-body);color:var(--muted)}
.sub-row .nx{font-size:12px;color:var(--muted);margin-top:2px}
.fab{position:absolute;right:18px;bottom:18px;z-index:6;width:60px;height:60px;border-radius:50%;border:0;background:var(--rose-ink);color:#fff;font:500 36px/1 var(--font-body);box-shadow:0 10px 24px rgba(178,62,117,.45);cursor:pointer;transition:transform .15s}
.fab:active{transform:scale(.92) rotate(90deg)}

/* Alerts */
.settings .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.settings .set-row+.set-row{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.settings h3{font:600 16px var(--font-body)}
.settings p{font-size:13px;color:var(--muted);margin-top:2px}
.alert-card{border-radius:24px;padding:16px;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px}
.alert-card.trial{background:linear-gradient(135deg,#FBE3EC,var(--card) 70%)}
.alert-top{display:flex;gap:12px}
.alert-ico{flex:none;width:44px;height:44px;border-radius:16px;display:grid;place-items:center;font-size:22px;background:var(--teal-soft)}
.alert-card.trial .alert-ico{background:var(--rose-soft)}
.alert-top h3{font:600 16px/1.3 var(--font-body)}
.alert-top p{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.alert-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.handled{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:18px;background:rgba(43,35,48,.05);margin-bottom:8px}
.handled .t{flex:1;font-size:14px}
.handled .t small{display:block;color:var(--muted);font-size:12px}

/* Split */
.save-card{background:linear-gradient(135deg,var(--teal-soft),var(--card) 80%);position:relative;overflow:hidden}
.save-card .big{color:var(--teal-ink)}
.save-card::after{content:"";position:absolute;right:-30px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--mint),transparent 70%)}
.pick{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 16px;min-height:42px;background:var(--card);box-shadow:var(--shadow);font:600 14px var(--font-body);cursor:pointer;transition:transform .15s}
.pick:active{transform:scale(.95)}
.pick i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pick[aria-pressed="true"]{background:var(--teal-ink);color:#fff}
.pick[aria-pressed="true"] i{box-shadow:0 0 0 2px #fff}
.faces{display:flex;margin-top:14px}
.faces .av{width:42px;height:42px;font-size:15px;letter-spacing:-.5px;border:3px solid var(--card)}
.faces .av+.av{margin-left:-10px}
.faces .more{background:rgba(43,35,48,.08);color:var(--ink)}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:rgba(43,35,48,.05);border-radius:16px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font:700 20px var(--font-display);margin-top:1px}
.bar{height:10px;border-radius:5px;background:rgba(43,35,48,.1);overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--teal),var(--mint));transition:width .6s cubic-bezier(.3,.8,.3,1)}
.friend{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.friend .mid{flex:1;min-width:0}
.friend .nm{font:600 16px var(--font-body)}
.friend .am{font-size:13px;color:var(--muted)}
.friend .acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.status{border:0;border-radius:999px;padding:7px 12px;min-height:34px;font:700 13px var(--font-body);cursor:pointer;transition:transform .15s}
.status:active{transform:scale(.94)}
.status.paid{background:var(--teal-soft);color:var(--teal-ink)}
.status.unpaid{background:var(--rose-soft);color:var(--rose-deep)}
.x-btn{border:0;background:none;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:16px;cursor:pointer}
.x-btn:active{background:rgba(43,35,48,.08)}

/* ---------- 5. SHEET / DIALOG / TOAST / TABBAR ---------- */
.tabbar{flex:none;display:flex;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(43,35,48,.05);position:relative;z-index:5}
.tab{position:relative;flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;min-height:54px;border-radius:18px;font:600 12px var(--font-body);color:var(--muted);cursor:pointer;transition:background .2s,color .2s,transform .15s}
.tab:active{transform:scale(.94)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--rose-deep);background:var(--rose-soft)}
.tab .badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rose-ink);color:#fff;font:700 11px/18px var(--font-body);text-align:center}

.overlay{position:absolute;inset:0;z-index:50;visibility:hidden;pointer-events:none}
.overlay.open{visibility:visible;pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(43,35,48,.48);opacity:0;transition:opacity .28s}
.overlay.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--ivory);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px rgba(43,35,48,.25);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.overlay.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(43,35,48,.2);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h2{font:600 22px var(--font-display)}
.sheet-head .icon-btn{width:40px;height:40px;box-shadow:none;background:rgba(43,35,48,.07)}

.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font:600 14px var(--font-body);margin-bottom:6px}
.input{width:100%;height:50px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:0 14px;font:500 16px var(--font-body);color:var(--ink)}
.input:focus{outline:none;border-color:var(--teal)}
.input.invalid{border-color:var(--danger);background:#FFF5F4}
.price-wrap{position:relative}
.price-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font:600 16px var(--font-display);color:var(--muted)}
.price-wrap .input{padding-left:30px}
.err{min-height:0;font-size:13px;font-weight:500;color:var(--danger);margin-top:4px}
.err:empty{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat-chips{display:flex;flex-wrap:wrap;gap:8px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.toggle-row b{font:600 15px var(--font-body);display:block}
.toggle-row small{font-size:12.5px;color:var(--muted)}
.hint{font-size:13px;color:var(--teal-ink);font-weight:500;margin-top:6px;line-height:1.45}
.sheet-actions{display:flex;flex-direction:column;gap:8px;margin-top:8px}

.steps{list-style:none;counter-reset:s;margin:6px 0 14px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:15px;line-height:1.5}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--rose-ink);color:#fff;font:700 14px/28px var(--font-display);text-align:center}
.tipbox{background:var(--teal-soft);color:var(--teal-ink);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:14px;font-weight:500}
.suggest{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.dialog{position:absolute;inset:0;z-index:70;display:grid;place-items:center;padding:28px;visibility:hidden;pointer-events:none}
.dialog.open{visibility:visible;pointer-events:auto}
.dialog .backdrop{opacity:0}
.dialog.open .backdrop{opacity:1}
.dialog-card{position:relative;width:100%;background:var(--card);border-radius:28px;padding:24px 20px 20px;text-align:center;box-shadow:var(--shadow-lg);transform:scale(.9);opacity:0;transition:transform .28s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.dialog.open .dialog-card{transform:none;opacity:1}
.dialog-card .em{font-size:40px}
.dialog-card h3{font:600 20px var(--font-display);margin:8px 0 6px}
.dialog-card p{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:16px}
.dialog-card .two{gap:10px}

.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:80;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);transform:translateY(30px);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .25s}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast button{border:0;background:none;color:var(--blush);font:700 14px var(--font-body);cursor:pointer;padding:6px 4px;min-height:36px}

/* ---------- 6. MASCOT ---------- */
.mascot-wrap{display:inline-block;flex:none;width:var(--w,96px);line-height:0;transform-origin:50% 100%;animation:bob 3.4s ease-in-out infinite}
.mascot{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
.mascot.pop{animation:bounceIn .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(1.015,.985)}}
@keyframes bounceIn{0%{opacity:0;transform:translateY(14px) scale(.4)}55%{opacity:1;transform:translateY(-6px) scale(1.08)}100%{opacity:1;transform:none}}
.buddy{display:flex;align-items:center;gap:10px;margin:-4px 0 14px}
.buddy-btn{border:0;background:none;padding:0;flex:none;cursor:pointer;border-radius:22px;line-height:0;transition:transform .15s}
.buddy-btn:active{transform:scale(.92)}
.bubble{position:relative;flex:1;min-width:0;background:var(--card);border-radius:20px;padding:12px 14px;font-size:14.5px;line-height:1.45;font-weight:500;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-6px;top:50%;width:14px;height:14px;background:var(--card);transform:translateY(-50%) rotate(45deg);border-radius:3px;z-index:-1}
.bubble b{font:700 18px var(--font-display);color:var(--rose-ink)}
.bubble small{display:block;margin-top:3px;font-size:12px;font-weight:500;color:var(--muted)}
.empty-mascot{display:flex;justify-content:center;margin:0 auto 8px}
.alert-ico.sprite{background:none!important;width:62px;height:auto;border-radius:0;display:block;margin:-6px -2px -6px -6px}
.alert-top p.nudge{color:var(--rose-deep);font-weight:600;margin-top:4px}
.banner .ico{flex:none;line-height:0;margin:-4px 0 -4px -4px}
.page-head .mascot-wrap{margin:-6px 0}
.save-card{padding-right:122px}
.save-card .big{font-size:44px}
.save-mascot{position:absolute;right:8px;bottom:6px;z-index:2}
.toast.rich{padding-left:88px;min-height:72px}
.toast .t-sprite{position:absolute;left:10px;bottom:6px}
/* splash + loader */
.loader{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(243,235,222,.9);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s;font-weight:600;color:var(--muted)}
.loader.open{opacity:1;visibility:visible;transition:opacity .2s}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--rose);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}

.seg.lang button{padding:6px 11px;min-height:34px;font-size:13px}
/* ---------- 7. INSIGHTS (value + deals) ---------- */
.insight-seg{display:flex;width:100%;margin:0 0 16px}
.insight-seg button{flex:1;min-height:42px;font-size:15px}
.chip-v-great{background:var(--teal-ink);color:#fff}
.chip-v-ok{background:var(--mint);color:var(--ink)}
.chip-v-low{background:var(--rose-soft);color:var(--rose-deep)}
.flag-card{background:linear-gradient(135deg,var(--blush),#FBE3EC 75%);padding:16px}
.flag-card.good{background:linear-gradient(135deg,var(--mint),var(--teal-soft) 85%)}
.flag-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:70px}
.flag-head h2{font:600 19px/1.25 var(--font-display)}
.flag-head p{font-size:13.5px;margin-top:3px;line-height:1.45}
.flag{background:rgba(255,250,242,.86);border-radius:20px;padding:12px;margin-top:12px}
.flag .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vline{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45;overflow-wrap:anywhere}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum-grid .k{font-size:12px;color:var(--muted);line-height:1.35}
.sum-grid .v{font:700 26px/1.1 var(--font-display);margin-top:4px;color:var(--rose-ink)}
.sum-grid .v.save{color:var(--teal-ink)}
.sum-grid .v small{font:500 12px var(--font-body);color:var(--muted);margin-left:2px}
.vrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.vrow .mid{flex:1;min-width:0}
.vrow .nm{font:600 16px var(--font-body)}
.vbar{height:8px;border-radius:4px;background:rgba(43,35,48,.1);overflow:hidden;margin-top:8px}
.vbar>i{display:block;height:100%;border-radius:4px;transition:width .6s cubic-bezier(.3,.8,.3,1)}
.vbar.tier-great>i{background:linear-gradient(90deg,var(--teal),var(--mint))}
.vbar.tier-ok>i{background:var(--mint)}
.vbar.tier-low>i{background:linear-gradient(90deg,var(--rose),var(--blush))}
.how-btn{display:flex;width:100%;align-items:center;justify-content:space-between;border:0;background:none;font:600 15px var(--font-body);cursor:pointer;padding:2px 0;min-height:36px;text-align:left}
.how-body{margin-top:10px;font-size:13.5px;line-height:1.55}
.how-body ol,.how-body ul{padding-left:20px}
.how-body li{margin-bottom:4px}
.usage-input{position:relative}
.usage-input .input{padding-right:64px}
.usage-input .unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;font-size:14px;pointer-events:none}
.slider{width:100%;margin:12px 0 4px;accent-color:var(--rose-ink);height:28px}
.preview{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.sample-note{display:flex;gap:8px;align-items:flex-start;background:rgba(43,35,48,.06);border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.45;font-weight:500;margin-bottom:14px}
.deal{margin-bottom:14px;padding:16px}
.deal.is-hidden{opacity:.7}
.dname{font:600 19px/1.25 var(--font-display);margin-top:8px}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dcol{background:rgba(43,35,48,.05);border-radius:16px;padding:10px 10px 10px;min-width:0}
.dcol.bundle{background:var(--teal-soft)}
.dcol h4{font:600 12.5px/1.3 var(--font-body);color:var(--muted);min-height:32px}
.dcol.bundle h4{color:var(--teal-ink)}
.dcol ul{list-style:none;margin-top:4px;min-height:60px}
.dcol li{display:flex;justify-content:space-between;gap:6px;font-size:13px;padding:2px 0}
.dcol li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcol .tot{border-top:1px dashed rgba(43,35,48,.25);margin-top:6px;padding-top:6px;display:flex;justify-content:space-between;gap:4px;font:700 14px var(--font-display)}
.dcol.bundle .tot{color:var(--teal-ink)}
.fine{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4}
.saving{margin-top:12px;border-radius:18px;padding:12px 14px;background:linear-gradient(135deg,var(--rose-soft),#FFF1F6)}
.saving .k{font:600 13px var(--font-body);color:var(--rose-deep)}
.saving.none{background:rgba(43,35,48,.06)}
.saving.none .k{color:var(--ink)}
.sv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px;color:var(--rose-deep)}
.sv small{font:600 13px var(--font-body);margin-left:2px}
.sv-m{font:700 24px var(--font-display)}
.sv-y{font:700 36px/1.1 var(--font-display)}
.sv-arrow{font-size:20px}
.cwrap{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.cwrap .lbl{font:600 12.5px var(--font-body);color:var(--muted);margin-right:2px}
.cav{margin-top:12px;background:#FFF3DD;border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.45}
.cav ul{padding-left:18px;margin-top:4px}
.cav li{margin-bottom:3px}
.linkbtn{border:0;background:none;color:var(--rose-deep);font:700 13px var(--font-body);padding:6px 0 0;cursor:pointer;min-height:32px;text-decoration:underline}
.deal .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dh{font:600 15px var(--font-body);margin:16px 0 4px}
.dlist{padding-left:18px;font-size:14px;line-height:1.5}
.dlist li{margin-bottom:3px}
.deal-chip{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;border:0;text-align:left;background:linear-gradient(135deg,var(--teal-soft),var(--card));border-radius:22px;box-shadow:var(--shadow);padding:12px 14px;font-size:14px;line-height:1.4}
.dc-ico{font-size:24px;line-height:1}
.dc-txt{flex:1;min-width:0}
.dc-txt b{color:var(--teal-ink)}
/* ---- Free / Premium ---- */
.demo-mode{display:flex;align-items:center;gap:8px;margin-top:8px}
.dm-label{font:600 12px var(--font-body);color:var(--muted)}
.seg.plan button{padding:4px 11px;min-height:30px;font-size:12.5px}
.seg.plan button[aria-pressed="true"]{color:var(--rose-deep)}
.crown-badge{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#F5C451;color:#5A3D00;align-items:center;justify-content:center;margin-left:-2px;animation:pop .5s cubic-bezier(.3,1.6,.4,1) both}
.crown-badge svg{width:14px;height:14px}
.view.swap>*{animation:swapfade .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes swapfade{from{opacity:.0;transform:translateY(8px) scale(.99);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.locked{position:relative;margin:10px 0;border-radius:22px;overflow:hidden;max-height:var(--lh,260px);min-height:220px}
.locked-blur{filter:blur(7px);opacity:.75;pointer-events:none;user-select:none;max-height:var(--lh,260px);overflow:hidden}
.locked-blur .card{margin-bottom:0}
.locked-cta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:12px 18px;background:rgba(243,235,222,.55)}
.locked-cta p{font-size:13px;line-height:1.4;color:var(--ink);max-width:270px}
.lock-line{display:flex;align-items:center;gap:6px;color:var(--rose-deep);font-size:15px}
.lock-svg{width:18px;height:18px;flex:none}
.locked-cta .btn{margin-top:4px}
.aff{font-size:11.5px;color:var(--muted);line-height:1.4;margin:8px 0 2px}
/* recommendations card */
.reco-card{margin-top:2px;margin-bottom:12px;background:linear-gradient(135deg,var(--card),var(--teal-soft))}
.reco-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.reco-head .k{font:700 12px var(--font-body);color:var(--teal-ink);letter-spacing:.2px}
.reco-head h2{font:600 19px/1.25 var(--font-display);margin-top:4px}
.reco-big{font:700 40px/1.05 var(--font-display);color:var(--teal-ink);margin-top:4px}
.reco-big small{font:600 15px var(--font-body);color:var(--muted)}
.reco-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:rgba(255,255,255,.7);border-radius:16px;padding:10px 12px;margin-top:8px}
.reco-row .mid{flex:1;min-width:0}
.reco-row .nm{font:600 15px var(--font-body)}
.reco-row .rs{text-align:right;flex:none;display:flex;flex-direction:column}
.reco-row .rs b{font:700 15px var(--font-body);color:var(--teal-ink)}
.reco-row .rs b small{font-size:11px;color:var(--muted);font-weight:600}
.reco-row .pr{font-weight:600;color:var(--ink)}.reco-row .pr b{color:var(--teal-ink)}
.reco-row .rs em{font:700 11px var(--font-body);font-style:normal;color:var(--teal-ink)}
.reco-row .rs span{font-size:11.5px;color:var(--muted)}
.reco-lock{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.4}
.reco-card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.insight-chips{position:sticky;top:-8px;z-index:3;background:var(--ivory,#F3EBDE);padding-top:8px;padding-bottom:10px;margin-bottom:6px}
.chips.wrapchips{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.filter-chip.sm{min-height:34px;padding:6px 12px;font-size:13px}
.filter-chip:disabled{cursor:default}
/* compare + plans */
.cmp,.plan,.wrong-plan{margin-bottom:12px}
.needs{margin:12px 0 8px}
.needs .lbl{font:600 12px var(--font-body);color:var(--muted);display:block;margin-bottom:6px}
.opt,.tier{border:1.5px solid rgba(43,35,48,.1);border-radius:16px;padding:10px 12px;margin-top:8px;background:rgba(255,255,255,.6)}
.opt.cur,.tier.cur{border-color:rgba(43,35,48,.28)}
.opt.best,.tier.rec{border-color:var(--teal-ink);background:var(--teal-soft)}
.opt-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.opt-price{margin-left:auto;font:700 15px var(--font-body)}
.opt-sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.opt-sub .good{color:var(--teal-ink);font-weight:700}.opt-sub .bad{color:var(--rose-deep);font-weight:700}
.chip.miss{text-decoration:line-through;opacity:.75}
.fit{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.fit .vbar{flex:1;margin-top:0}.fit b{color:var(--ink);font-size:14px;min-width:24px;text-align:right}
.verdict{margin-top:12px;border-radius:16px;padding:12px 14px;background:rgba(43,35,48,.05)}
.verdict.good{background:var(--teal-soft)}
.verdict b{font:600 15px var(--font-body)}.verdict p{font-size:13.5px;line-height:1.45;margin-top:4px}
.verdict .btn{margin-top:8px}
.wrong-plan h3{font:600 18px/1.25 var(--font-display)}.wrong-plan p{font-size:14px;margin-top:4px}
.av.lg{width:52px;height:52px;font-size:20px}
.reco-card .mascot-wrap{margin:-6px 0}
@media (prefers-reduced-motion:reduce){.view.swap>*,.crown-badge{animation:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>

    <!-- bottom sheet (add/edit sub, cancel guide, add friend) -->
    <div class="overlay" id="sheet" aria-hidden="true">
      <div class="backdrop" data-action="close-sheet"></div>

      </div>
    </div>

    <!-- confirm dialog -->
    <div class="dialog" id="dialog" aria-hidden="true">
      <div class="backdrop" data-action="close-dialog"></div>
      <div class="dialog-card" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle"><div id="dialogBody"></div></div>

    <div class="loader" id="loader" role="status" aria-hidden="true"><div id="loaderSprite"></div><div id="loaderText">กำลังคิดแป๊บนึง…</div><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>

   ===================================================================== */
const $  = (s, r = document) => r.querySelector(s);

// "Today" at local midnight — every demo date is relative to this
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const addDays = n => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return d; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const daysUntil = s => Math.round((parseISO(s) - TODAY) / 86400000);
const dateTh = s => parseISO(s).toLocaleDateString(LOC(), { day:'numeric', month:'short' });

const fmtInt = n => Math.round(n).toLocaleString('en-US');

const fmtNum = n => { const r = Math.round(Number((n * 100).toPrecision(12))) / 100;   // toPrecision avoids 4.975 → 4.97
  return Number.isInteger(r) ? r.toLocaleString('en-US') : r.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }); };

/* =====================================================================
   4. DERIVED DATA
   ===================================================================== */
const monthlyOf = s => s.cycle === 'year' ? s.price / 12 : s.price;

// Spending excludes free trials (nothing is charged yet)
function totals() {
  const byCat = {}; Object.keys(CATS).forEach(k => byCat[k] = 0);
  let total = 0;
  state.subs.forEach(s => { if (s.trial) return; const m = monthlyOf(s); byCat[s.cat] += m; total += m; });
  return { byCat, total };
}

function buildAlerts() {
  if (!state.settings.remind) return [];
  const lead = state.settings.lead, out = [];
  state.subs.forEach(s => {
    const d = daysUntil(s.next);
    if (d < 0 || d > lead) return;
    out.push(s.trial
      ? { key:`trial-${s.id}-${s.next}`, type:'trial', sub:s, days:d }
      : { key:`charge-${s.id}-${s.next}`, type:'charge', sub:s, days:d });
  });
  return out.sort((a, b) => a.days - b.days || (a.type === 'trial' ? -1 : 1));
}
const activeAlerts = () => buildAlerts().filter(a => !state.alertStatus[a.key]);

function planStats(s) {
  const fr = (state.splits[s.id] || { friends:[] }).friends;
  const m = monthlyOf(s), n = fr.length + 1;
  const per = fr.length ? Math.ceil(m / n) : 0;         // friends pay a whole-baht share
  const due = per * fr.length;
  const you = Math.max(m - due, 0);
  const collected = fr.filter(f => f.paid).length * per;
  return { fr, m, n, per, due, you, collected, savings: due, max: s.maxShare || 6 };
}
function totalSavings() {
  return state.subs.filter(s => s.shareable).reduce((a, s) => a + planStats(s).savings, 0);
}

const initialsOf = name => {
  const w = name.trim().split(/\s+/).filter(Boolean);
  const a = Array.from(w[0] || '?');
  return w.length > 1 ? (a[0] + Array.from(w[1])[0]).toUpperCase() : a[0].toUpperCase();
};

function emptyState({ icon, sprite, title, text, buttons = '' }) {
  const art = sprite
    ? `<div class="empty-mascot">${mascot(sprite, { w:150, slot:'empty' })}</div>`
    : `<div class="empty-ico" aria-hidden="true">${icon}</div>`;
  return `<div class="empty">${art}<h3>${title}</h3><p>${text}</p>${buttons}</div>`;
}
const pageHead = (title, sub, right = '') =>
  `<header class="page-head"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${right}</header>`;

function daysChip(d, trial) {
  const cls = d <= 1 ? 'chip-rose' : 'chip-teal';
  const txt = trial ? T(`ทดลองหมด${dayWord(d)}`, `Trial ends ${dayWord(d)}`) : T(`ตัดเงิน${dayWord(d)}`, `Charges ${dayWord(d)}`);
  return `<span class="chip ${cls}">${txt}</span>`;
}

        <div class="v" style="font-size:18px">${esc(top.name)}</div>
        <div class="s" style="color:var(--rose-deep)">${fmtMoney(Math.round(monthlyOf(top)))}/${T('เดือน', 'mo')}</div>

  return head + homeBuddy() + `
    <section class="card total-card" aria-label="${T('ยอดรวม', 'Total')}">

        <div class="seg" role="group" aria-label="${T('เลือกช่วงเวลา', 'Choose period')}">

        </div>
      </div>
      <div class="big" aria-live="polite"><span class="cur">฿</span><span data-count="${total}" data-key="total">0</span><span class="per">/${state.period === 'year' ? T('ปี', 'yr') : T('เดือน', 'mo')}</span></div>
      <p class="muted small" style="margin-top:6px">${T(`≈ ฿${fmtInt(perDay)} ต่อวัน${trialCount ? ` · ไม่รวมช่วงทดลอง ${trialCount} รายการ` : ''}`, `≈ ฿${fmtInt(perDay)} per day${trialCount ? ` · excludes ${trialCount} trial${trialCount > 1 ? 's' : ''}` : ''}`)}</p>

/* ---------- 6.2 SUBSCRIPTIONS ---------- */
function filteredSubs() {
  const q = state.query.trim().toLowerCase();
  return state.subs
    .filter(s => (state.filter === 'all' || s.cat === state.filter) && (!q || s.name.toLowerCase().includes(q)))
    .sort((a, b) => daysUntil(a.next) - daysUntil(b.next));
}
function subRow(s) {
  const d = daysUntil(s.next);
  return `<button class="sub-row press" data-action="edit-sub" data-id="${s.id}" aria-label="${T('แก้ไข ', 'Edit ')}${esc(s.name)}">
    ${avatar(s)}
    <div class="mid">
      <div class="nm">${esc(s.name)}</div>
      <div class="meta"><span>${catLabel(s.cat)} · ${s.cycle === 'year' ? T('รายปี', 'Yearly') : T('รายเดือน', 'Monthly')}</span>${s.trial ? `<span class="chip chip-rose">${T('ทดลองใช้', 'Trial')}</span>` : ''}${s.shareable ? `<span class="chip chip-teal">${T('แชร์ได้', 'Shareable')}</span>` : ''}</div>
    </div>
    <div class="rt">
      <div class="pr">${fmtMoney(s.price)}<small>/${s.cycle === 'year' ? T('ปี', 'yr') : T('ด.', 'mo')}</small></div>
      <div class="nx">${s.trial ? T('เริ่มตัด', 'Starts') : T('ตัด', 'Due')} ${dateTh(s.next)}${d >= 0 && d <= 3 ? ` · ${dayWord(d)}` : ''}</div>
    </div>
  </button>`;
}
function subListHTML() {
  const rows = filteredSubs();
  if (!rows.length) {
    return emptyState({
      sprite:'thinking', title:T('ไม่พบรายการ', 'No results'),
      text:T('ลองเปลี่ยนคำค้นหาหรือหมวดหมู่ดูนะ', 'Try a different search or category'),
      buttons:`<button class="btn btn-soft" data-action="clear-filter">${T('ล้างตัวกรอง', 'Clear filters')}</button>`
    });
  }
  return rows.map(subRow).join('');
}
function subSummaryText() {
  const rows = filteredSubs().filter(s => !s.trial);
  const m = rows.reduce((a, s) => a + monthlyOf(s), 0);
  return `${T(`${filteredSubs().length} รายการ · ≈ ${fmtMoney(Math.round(m))}/เดือน`, `${filteredSubs().length} item${filteredSubs().length === 1 ? '' : 's'} · ≈ ${fmtMoney(Math.round(m))}/mo`)}`;
}
function renderSubs() {
  const head = pageHead(T('รายการสมัคร', 'Subscriptions'), T('บริการที่คุณจ่ายอยู่ทั้งหมด', 'Everything you pay for'), mascot('checklist', { w:86, slot:'subs-head' }));
  if (!state.subs.length) {
    return head + emptyState({
      sprite:'confused', title:T('ยังไม่มีรายการสมัคร', 'No subscriptions yet'),
      text:T('เพิ่มรายการแรกกันเถอะ! เช่น Netflix, Spotify หรือบริการอื่นที่คุณใช้', 'Let\'s add your first one! e.g. Netflix, Spotify or anything you use'),
      buttons:`<button class="btn btn-primary" data-action="add-sub">${T('+ เพิ่มรายการ', '+ Add subscription')}</button> <button class="btn btn-ghost" data-action="reset-demo">${T('ใช้ข้อมูลตัวอย่าง', 'Use sample data')}</button>`
    });
  }
  const chip = (k, label) => `<button class="filter-chip" data-action="set-filter" data-v="${k}" aria-pressed="${state.filter === k}">${label}</button>`;
  return head + `
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="${T('ค้นหาชื่อบริการ', 'Search by service name')}" value="${esc(state.query)}" aria-label="${T('ค้นหารายการสมัคร', 'Search subscriptions')}" autocomplete="off">
    </div>

/* ---------- 6.3 ALERTS ---------- */
function alertCard(a) {
  const s = a.sub, trial = a.type === 'trial';
  const title = trial ? T(`ทดลองใช้ ${esc(s.name)} หมด${dayWord(a.days)}`, `${esc(s.name)} trial ends ${dayWord(a.days)}`) : T(`${esc(s.name)} จะตัดเงิน${dayWord(a.days)}`, `${esc(s.name)} will be charged ${dayWord(a.days)}`);
  const body = trial
    ? T(`ถ้าไม่ยกเลิก จะถูกตัด ${fmtMoney(s.price)} ในวันที่ ${dateTh(s.next)}`, `${fmtMoney(s.price)} will be charged on ${dateTh(s.next)} unless you cancel`)
    : T(`${fmtMoney(s.price)} · วันที่ ${dateTh(s.next)} · ${catLabel(s.cat)}`, `${fmtMoney(s.price)} · ${dateTh(s.next)} · ${catLabel(s.cat)}`);
  const nudge = trial ? T('เหมียว!! รีบตัดสินใจก่อนโดนตัดเงินนะ', 'Meow!! Decide before you get charged') : T('เตรียมเงินไว้ หรือกดเลื่อนถ้ายังไม่พร้อมนะ', 'Get your balance ready, or snooze if you\'re not set');
  return `<article class="alert-card ${trial ? 'trial' : ''}">
    <div class="alert-top">
      <div class="alert-ico sprite" aria-hidden="true">${mascot('surprised', { w:62, slot:'al-' + s.id })}</div>
      <div style="flex:1;min-width:0">
        <div class="row between" style="align-items:flex-start;gap:8px"><h3>${title}</h3>${a.days <= 1 ? `<span class="chip chip-rose">${T('ด่วน', 'Urgent')}</span>` : ''}</div>
        <p>${body}</p><p class="nudge">${nudge}</p>
      </div>
    </div>
    <div class="alert-acts">
      <button class="btn btn-soft btn-sm" data-action="cancel-guide" data-id="${s.id}">${T('วิธียกเลิก', 'How to cancel')}</button>
      <button class="btn btn-ghost btn-sm" data-action="snooze" data-key="${a.key}">${T('เลื่อนไป', 'Snooze')}</button>
      <button class="btn btn-teal btn-sm" data-action="alert-done" data-key="${a.key}">${T('เสร็จแล้ว', 'Done')}</button>
    </div>
  </article>`;
}
function renderAlerts() {
  const st = state.settings;
  const all = buildAlerts();
  const active = all.filter(a => !state.alertStatus[a.key]);
  const handled = all.filter(a => state.alertStatus[a.key]);
  const lead = n => `<button data-action="set-lead" data-v="${n}" aria-pressed="${st.lead === n}">${n} ${T('วัน', n === 1 ? 'day' : 'days')}</button>`;

  const settings = `
    <section class="card settings" aria-label="${T('ตั้งค่าการแจ้งเตือน', 'Alert settings')}">
      <div class="set-row">
        <div><h3>${T('เปิดการแจ้งเตือน', 'Turn on reminders')}</h3><p>${T('เตือนก่อนถูกตัดเงินและก่อนหมดช่วงทดลอง', 'Remind you before charges and before trials end')}</p></div>
        <button class="switch" role="switch" aria-checked="${st.remind}" aria-label="${T('เปิดหรือปิดการแจ้งเตือน', 'Turn reminders on or off')}" data-action="toggle-remind"></button>
      </div>
      <div class="set-row">
        <div><h3>${T('เตือนล่วงหน้า', 'Remind me ahead')}</h3><p>${T('เลือกจำนวนวันก่อนวันตัดเงิน', 'Choose how many days before the charge')}</p></div>
        <div class="seg" role="group" aria-label="${T('เตือนล่วงหน้า', 'Remind me ahead')}" aria-disabled="${!st.remind}">${lead(1)}${lead(2)}${lead(3)}</div>
      </div>
    </section>`;

  let feed;
  if (!st.remind) {
    feed = emptyState({ sprite:'sleepy', title:T('ปิดการแจ้งเตือนอยู่', 'Reminders are off'), text:T('เปิดการแจ้งเตือนเพื่อไม่ให้พลาดวันตัดเงินและวันหมดช่วงทดลอง', 'Turn them on so you never miss a charge or a trial ending'), buttons:`<button class="btn btn-primary" data-action="toggle-remind">${T('เปิดการแจ้งเตือน', 'Turn on reminders')}</button>` });
  } else if (!active.length) {
    feed = emptyState({ sprite: handled.length ? 'happy' : 'sleepy', title: handled.length ? T('จัดการครบแล้ว!', 'All done!') : T('ไม่มีอะไรต้องกังวล', 'Nothing to worry about'), text: handled.length ? T('ไม่มีอะไรค้างอยู่แล้ว สบายใจได้เลย', 'Nothing left. You\'re all set!') : T(`ยังไม่มีรายการที่จะตัดเงินใน ${st.lead} วันข้างหน้า`, `Nothing will be charged in the next ${st.lead} day${st.lead > 1 ? 's' : ''}`) });
  } else {
    feed = active.map(alertCard).join('');
  }

  const handledHTML = (st.remind && handled.length) ? `
    <div class="section-head"><h2>${T('จัดการแล้ว', 'Handled')}</h2><span class="muted small">${T(`${handled.length} รายการ`, `${handled.length} item${handled.length === 1 ? '' : 's'}`)}</span></div>
    ${handled.map(a => `<div class="handled"><div class="t">${esc(a.sub.name)}<small>${state.alertStatus[a.key] === 'done' ? T('เสร็จแล้ว', 'Done') : T('เลื่อนไปพรุ่งนี้', 'Snoozed until tomorrow')}</small></div>
      <button class="btn btn-ghost btn-sm" data-action="restore-alert" data-key="${a.key}">${T('เลิกทำ', 'Undo')}</button></div>`).join('')}` : '';

  return pageHead(T('แจ้งเตือน', 'Alerts'), active.length ? T(`มี ${active.length} เรื่องที่ต้องดู`, `${active.length} to look at`) : T('ไม่มีอะไรค้าง', 'Nothing pending')) + settings +
    `<div class="section-head"><h2>${T('ล่าสุด', 'Latest')}</h2></div>` + feed + handledHTML;
}

const unitName = (cat, n) => ({
  video:T('ชม.', n === 1 ? 'hr' : 'hrs'), music:T('ชม.', n === 1 ? 'hr' : 'hrs'),
  ai:T('ครั้ง', n === 1 ? 'use' : 'uses'), cloud:'GB', learning:T('บท', n === 1 ? 'lesson' : 'lessons')
})[cat];
const perName = cat => ({ video:T('ชม.','hr'), music:T('ชม.','hr'), ai:T('ครั้ง','use'), cloud:'GB', learning:T('บท','lesson') })[cat];
const usageLabel = cat => ({
  video:T('ชั่วโมงที่ดูเดือนนี้', 'Hours watched this month'),
  music:T('ชั่วโมงที่ฟังเดือนนี้', 'Hours listened this month'),

  learning:T('บทเรียน / คอร์สที่เรียนจบเดือนนี้', 'Lessons / courses completed this month')

const TIER_LABEL = {
  great:() => T('คุ้มมาก', 'Great value'),
  ok:   () => T('พอใช้', 'OK'),
  low:  () => T('ใช้น้อย ลองทบทวน', 'Low use, rethink')

const badge = tier => `<span class="chip chip-v-${tier}">${TIER_LABEL[tier]()}</span>`;

/* ---------- FEATURE A: value analysis ---------- */
// piecewise score: thresholds map to the SCORE_CUTS so ranking, bar and badge always agree
function scoreOf(m, th) {
  if (th.better === 'lower') {
    if (m <= th.great) return 100 - 25 * (m / th.great);
    if (m <= th.ok)    return 75 - 35 * ((m - th.great) / (th.ok - th.great));
    return Math.max(0, 40 - 40 * ((m - th.ok) / th.ok));
  }
  if (m >= th.great) return 75 + 25 * Math.min(1, (m - th.great) / (100 - th.great));
  if (m >= th.ok)    return 40 + 35 * ((m - th.ok) / (th.great - th.ok));
  return 40 * (m / th.ok);
}
const tierOf = score => score >= SCORE_CUTS.great ? 'great' : score >= SCORE_CUTS.ok ? 'ok' : 'low';

// state: 'trial' (not ranked until billed) · 'untracked' (no usage entered) · 'zero' (0 used) · 'scored'
function analyze(s, u = state.usage[s.id], quota = quotaOf(s)) {
  const monthly = monthlyOf(s);                       // yearly plans ÷ 12
  const base = { sub:s, monthly };
  if (s.trial) return { ...base, state:'trial' };
  if (u === undefined || u === null) return { ...base, state:'untracked' };
  const th = VALUE_THRESHOLDS[s.cat], cloud = s.cat === 'cloud';
  const pct = cloud ? clamp(u / quota * 100, 0, 100) : null;
  if (!(u > 0)) return { ...base, usage:0, quota:cloud ? quota : null, pct, state:'zero', score:0, tier:'low' };   // never divide by 0
  const perUnit = monthly / u;
  const score = scoreOf(th.metric === 'pctUsed' ? pct : perUnit, th);
  return { ...base, usage:u, quota:cloud ? quota : null, pct, perUnit, state:'scored', score, tier:tierOf(score) };
}
function valueReport() {
  const all = state.subs.map(s => analyze(s));
  const ranked = all.filter(a => a.state === 'scored' || a.state === 'zero')
    .sort((a, b) => b.score - a.score || b.monthly - a.monthly);                       // best → worst
  const unranked = all.filter(a => a.state === 'trial' || a.state === 'untracked');
  const low = ranked.filter(a => a.tier === 'low');
  const lowMonthly = low.reduce((n, a) => n + a.monthly, 0);
  const flagged = low.slice().sort((a, b) => a.score - b.score || b.monthly - a.monthly)
    .filter(a => !state.valueDismissed[a.sub.id]).slice(0, 2);                          // worst 1–2 not yet decided
  return { ranked, unranked, low, lowMonthly, lowYearly:lowMonthly * 12, flagged };
}

/* ---------- FEATURE B: deals — computed from the user's real subscription list ---------- */
function matchDeals() {
  const live = state.subs.filter(s => !s.trial);       // trials aren't being paid for yet
  return DEALS.map(d => {
    const covered = [];
    d.includes.forEach(inc => {
      const sub = live.find(s => inc.re.test(s.name) && !covered.some(c => c.sub === s));
      if (sub) covered.push({ sub, inc });
    });
    if (!covered.length) return null;                  // no overlap → no deal card
    const lines = [{ label:L(d.base.short), short:L(d.base.short), amount:d.base.price },
      ...covered.map(c => ({ label:c.sub.name, short:c.sub.name, amount:monthlyOf(c.sub) }))];
    const separate = lines.reduce((n, l) => n + l.amount, 0);
    const saving = separate - d.price;
    return { deal:d, covered, lines, separate, saving, yearly:saving * 12,
      notIncluded:live.filter(s => !covered.some(c => c.sub === s)),
      caveats:dealCaveats(d, covered, separate) };
  }).filter(Boolean);
}
function dealCaveats(d, covered, separate) {
  const c = [];
  c.push(T(`สัญญา ${d.contractMonths} เดือน · ยกเลิกก่อนกำหนดเสียค่าธรรมเนียม ${fmtMoney(d.etf)}`, `${d.contractMonths}-month contract · early cancellation fee ${fmtMoney(d.etf)}`));
  if (d.afterPromo) {
    const after = separate - d.afterPromo;
    c.push(T(`หลัง ${d.contractMonths} เดือนราคาขึ้นเป็น ${fmtMoney(d.afterPromo)}/เดือน ${after > 0 ? `(ประหยัดเหลือ ${fmtMoney(after)}/เดือน)` : '(ไม่ประหยัดแล้ว)'}`,
             `After ${d.contractMonths} months the price rises to ${fmtMoney(d.afterPromo)}/mo ${after > 0 ? `(saving drops to ${fmtMoney(after)}/mo)` : '(no saving left)'}`));
  }
  covered.forEach(({ sub, inc }) => {
    const used = state.usage[sub.id];
    if (inc.capGB && used > inc.capGB) c.push(T(`${sub.name}: คุณใช้ ${fmtNum(used)} GB แต่แพ็กเกจให้ ${inc.capGB} GB`, `${sub.name}: you use ${fmtNum(used)} GB but the bundle includes ${inc.capGB} GB`));
    if (sub.cycle === 'year') c.push(T(`${sub.name} จ่ายรายปี — จะประหยัดจริงเมื่อถึงรอบต่ออายุ ${dateTh(sub.next)}`, `${sub.name} is billed yearly — the saving starts at renewal on ${dateTh(sub.next)}`));
    const fr = state.splits[sub.id] ? state.splits[sub.id].friends.length : 0;
    if (fr) c.push(T(`${sub.name} แชร์กับเพื่อน ${fr} คนอยู่ — ตรวจก่อนว่าบัญชีในแพ็กเกจแชร์ต่อได้ไหม`, `${sub.name} is split with ${fr} friend${fr > 1 ? 's' : ''} — check whether the bundle account can be shared`));
  });
  covered.forEach(({ sub, inc }) => c.push(`${sub.name}: ${L(inc.note)}`));
  d.extra.forEach(x => c.push(L(x)));
  return c;
}
const dealSort = (a, b) => (!!state.dealsSaved[b.deal.id] - !!state.dealsSaved[a.deal.id]) || b.saving - a.saving;

/* ---------- Compare: personalised "fit for you" score ---------- */
function needsOf(s) {
  const base = (state.needs[s.id] || DEFAULT_NEEDS[s.cat]).slice();
  const sk = SHARE_KEY[s.cat], friends = state.splits[s.id] ? state.splits[s.id].friends.length : 0;
  if (friends > 0 && sk && !base.includes(sk)) base.push(sk);          // you split it → you need sharing
  return base;
}
function compareFor(s) {
  const cat = s.cat, usage = state.usage[s.id], monthly = monthlyOf(s), needs = needsOf(s);
  const cur = { name:s.name, price:monthly, feats:CURRENT_FEATS[cat], quota:cat === 'cloud' ? quotaOf(s) : null, current:true };
  const alts = ALTERNATIVES[cat].map((a, idx) => ({ ...a, idx }));
  const all = [cur, ...alts], maxP = Math.max(...all.map(o => o.price));
  all.forEach(o => {                                                    // fit = 40% price + 40% needed features + 20% capacity for your usage
    const cost = 1 - 0.8 * o.price / maxP;
    const feat = needs.length ? needs.filter(n => o.feats.includes(n)).length / needs.length : 1;
    const cap = usage > 0 ? Math.min(1, (o.cap || o.quota || Infinity) / usage) : 1;
    o.fit = Math.round(100 * (0.4 * cost + 0.4 * feat + 0.2 * cap));
    o.perUnit = usage > 0 ? o.price / usage : null;
    o.missing = needs.filter(n => !o.feats.includes(n));
  });
  const sorted = alts.slice().sort((a, b) => b.fit - a.fit);
  return { sub:s, usage, needs, current:cur, alts:sorted, bestAlt:sorted[0] };
}
const featLabel = (cat, k) => L(FEATURE_VOCAB[cat][k]);
const fitTier = n => n >= 75 ? 'great' : n >= 55 ? 'ok' : 'low';
function optRow(o, c, best) {
  const cat = c.sub.cat;
  const feats = c.needs.map(n => `<span class="chip ${o.feats.includes(n) ? 'chip-teal' : 'chip-ink miss'}">${o.feats.includes(n) ? '✓' : '✕'} ${esc(featLabel(cat, n))}</span>`).join('');
  return `<div class="opt${o.current ? ' cur' : ''}${best ? ' best' : ''}">
    <div class="opt-top"><b>${esc(o.name)}</b>${o.current ? `<span class="chip chip-ink">${T('แพลนของคุณ', 'Your plan')}</span>` : ''}${best ? `<span class="chip chip-v-great">${T('เหมาะที่สุด', 'Best fit')}</span>` : ''}
      <span class="opt-price">${fmtMoney(o.price)}/${T('เดือน', 'mo')}</span></div>
    <div class="opt-sub">${o.perUnit != null ? `${fmtMoney(o.perUnit)}/${perName(cat)} · ` : ''}${T('ใช้ได้', 'covers')} ${o.cap ? fmtNum(o.cap) + ' ' + unitName(cat, 2) : o.quota ? fmtNum(o.quota) + ' GB' : T('ไม่จำกัด', 'unlimited')}</div>
    <div class="cwrap" style="margin-top:6px">${feats}</div>
    <div class="fit"><span>${T('เหมาะกับคุณ', 'Fit for you')}</span><div class="vbar tier-${fitTier(o.fit)}"><i style="width:${Math.max(o.fit, 4)}%"></i></div><b>${o.fit}</b></div></div>`;
}
function compareCard(c, { limit = null } = {}) {
  const s = c.sub, a = analyze(s), cat = s.cat;
  const vocab = Object.keys(FEATURE_VOCAB[cat]), sk = SHARE_KEY[cat];
  const needChips = vocab.map(k => {
    const auto = k === sk && needsOf(s).includes(k) && !(state.needs[s.id] || DEFAULT_NEEDS[cat]).includes(k);
    const on = c.needs.includes(k);
    return `<button class="filter-chip sm" ${limit || auto ? 'disabled' : `data-action="toggle-need" data-id="${s.id}" data-v="${k}"`} aria-pressed="${on}">${esc(featLabel(cat, k))}${auto ? ' 🔗' : ''}</button>`;
  }).join('');
  const better = c.bestAlt.fit >= c.current.fit + 3 && c.bestAlt.price < c.current.price && !c.bestAlt.missing.length;
  const rows = c.alts.map((o, i) => optRow(o, c, better && i === 0));
  const shown = limit ? rows.slice(0, limit) : rows, hidden = limit ? rows.slice(limit) : [];
  const save = c.current.price - c.bestAlt.price;
  const verdict = limit ? '' : better
    ? `<div class="verdict good"><b>${T(`${esc(c.bestAlt.name)} เหมาะกับคุณมากกว่า`, `${esc(c.bestAlt.name)} fits you better`)}</b>
        <p>${T(`ประหยัด ${fmtMoney(save)}/เดือน (${fmtMoney(save * 12)}/ปี) และยังตอบโจทย์สิ่งที่คุณต้องการ`, `Saves ${fmtMoney(save)}/mo (${fmtMoney(save * 12)}/yr) and still covers what you need.`)}</p>
        ${affNote()}<button class="btn btn-primary btn-sm" data-action="offer-alt" data-id="${s.id}" data-alt="${c.bestAlt.idx}">${T('ดูข้อเสนอ', 'View offer')}</button></div>`
    : `<div class="verdict"><b>${T('แพลนปัจจุบันเหมาะกับคุณแล้ว', 'Your current plan is a good fit')}</b><p>${T('ไม่มีตัวเลือกไหนที่ตอบโจทย์และถูกกว่าอย่างชัดเจน', 'No alternative is clearly better and cheaper for you.')}</p></div>`;
  return `<article class="card cmp" aria-label="${esc(s.name)}">
    <div class="row" style="gap:12px">${avatar(s)}<div style="flex:1;min-width:0"><div style="font:600 17px var(--font-body)">${esc(s.name)} <span class="muted" style="font-weight:500">${T('เทียบกับทางเลือก', 'vs alternatives')}</span></div>
      <div class="vline">${T('การใช้งานของคุณ:', 'Your usage:')} ${usageOrNone(s)}${a.state === 'scored' ? ` → ${fmtMoney(a.perUnit)}/${perName(cat)}` : ''}</div></div></div>
    <div class="needs"><span class="lbl">${T('สิ่งที่คุณต้องการ', 'What you need')}</span><div class="chips wrapchips">${needChips}</div></div>
    ${optRow(c.current, c, false)}${shown.join('')}
    ${hidden.length ? lockedBlock(hidden.join(''), { key:'cmp-' + s.id, title:lockTitle(), text:T('ดูทางเลือกที่เหลือพร้อมคะแนนความเหมาะสม', 'See the other alternatives with their fit scores'), sprite:'shy', h:210 }) : ''}
    ${verdict}</article>`;
}
function compareHTML() {
  const subs = eligibleSubs();
  if (!subs.length) return sampleNote() + emptyState({ sprite:'thinking', title:T('ยังไม่มีบริการให้เปรียบเทียบ', 'Nothing to compare yet'), text:T('เพิ่มรายการสมัคร (ที่ไม่ใช่ช่วงทดลอง) เพื่อเปรียบเทียบทางเลือก', 'Add a subscription (not a trial) to compare alternatives') });

  return sampleNote() + serviceChips(subs, sel, 'pick-compare') + compareCard(compareFor(getSub(sel)));
}
function teaserSub() {                                // most under-used service, or the first one
  const w = valueReport().low.slice().sort((a, b) => a.score - b.score)[0];
  return w ? w.sub : eligibleSubs()[0];
}

/* ---------- Plans: tier comparison + switch suggestion ---------- */
function planInfo(s) {
  const ladder = PLANS.find(p => p.re.test(s.name)); if (!ladder || s.trial) return null;
  const monthly = monthlyOf(s), usage = state.usage[s.id];
  const friends = state.splits[s.id] ? state.splits[s.id].friends.length : 0;
  const curTier = ladder.tiers.find(t => t.key === ladder.current);
  const tiers = ladder.tiers.map(t => t.key === ladder.current ? { ...t, price:monthly, current:true } : { ...t }).sort((a, b) => a.price - b.price);
  const sharing = !!curTier.group && friends > 0;                       // shared group plan → keep it
  const ok = t => !t.current && !t.ads && !t.group && !sharing && !(t.solo && friends > 0) && (t.cap == null || usage == null || usage <= t.cap);
  const best = tiers.filter(ok)[0];
  const saving = best ? monthly - best.price : 0;
  return { sub:s, tiers, monthly, usage, friends, sharing, best:saving > 0 ? best : null, saving:Math.max(0, saving) };
}
function planCard(s) {

  }).join('');
  const why = rec

    : pi.sharing ? T(`${s.name} แชร์กับเพื่อน ${pi.friends} คน แพลนกลุ่มคุ้มที่สุดแล้ว`, `${s.name} is shared with ${pi.friends} friend${pi.friends > 1 ? 's' : ''} — the group plan is the best fit.`)
    : T('คุณอยู่ในแพลนที่เหมาะกับการใช้งานแล้ว', 'You are already on the right plan for your usage.');
  return `<article class="card plan" aria-label="${esc(s.name)}">
    <div class="row" style="gap:12px">${avatar(s)}<div style="flex:1;min-width:0"><div style="font:600 17px var(--font-body)">${esc(s.name)}</div>
      <div class="vline">${T('การใช้งาน:', 'Usage:')} ${uTxt}</div></div></div>

/* ---------- Recommendations (keep / change / cancel) ---------- */
function recoFor(s) {
  const a = analyze(s), base = { sub:s, monthly:monthlyOf(s) };
  if (a.state === 'trial') return { ...base, action:'review', saving:0, text:T(`ทดลองใช้ — ตัดสินใจก่อน ${dateTh(s.next)}`, `Free trial — decide before ${dateTh(s.next)}`) };
  if (a.state === 'untracked') return { ...base, action:'review', saving:0, text:T('อัปเดตการใช้งานเพื่อให้เราประเมินได้', 'Add your usage so we can assess it') };
  const pi = planInfo(s), c = compareFor(s);
  const planSave = pi && pi.best ? pi.saving : 0;
  const altBetter = c.bestAlt.fit >= c.current.fit + 3 && c.bestAlt.price < c.current.price && !c.bestAlt.missing.length;
  const altSave = altBetter ? c.current.price - c.bestAlt.price : 0;
  if (a.state === 'zero') return { ...base, action:'cancel', kind:'cancel', saving:base.monthly, text:T('ไม่ได้ใช้เลย — ยกเลิกได้', 'Not used at all — you can cancel') };
  if (a.tier === 'low' && pi && pi.best && pi.best.price === 0) return { ...base, action:'cancel', kind:'cancel', saving:pi.saving, text:T(`ยกเลิกหรือลดเป็นแพลนฟรี (${L(pi.best.note)})`, `Cancel or drop to the Free tier (${L(pi.best.note)})`) };
  const useAlt = altSave > planSave, save = useAlt ? altSave : planSave;
  if (save >= Math.max(20, base.monthly * 0.15)) {
    return { ...base, action:'change', kind:useAlt ? 'alt' : 'plan', saving:save,
      text: useAlt ? T(`ย้ายไป ${c.bestAlt.name}`, `Move to ${c.bestAlt.name}`) : T(`เปลี่ยนเป็นแพลน ${tierName(pi.best.key)}`, `Switch to the ${tierName(pi.best.key)} plan`) };
  }
  return { ...base, action:'keep', saving:0, text:T('เหมาะกับคุณแล้ว — เก็บไว้', 'Good fit — keep it') };
}
function recoReport() {
  const items = state.subs.map(recoFor), order = { cancel:0, change:1, review:2, keep:3 };
  items.sort((a, b) => (b.saving - a.saving) || (order[a.action] - order[b.action]));
  const n = k => items.filter(i => i.action === k).length;
  const monthly = items.reduce((t, i) => t + i.saving, 0);
  return { items, monthly, yearly:monthly * 12, nChange:n('change'), nCancel:n('cancel'), nKeep:n('keep'), nReview:n('review'), toReview:items.filter(i => i.action !== 'keep') };
}

/* =====================================================================
   7. RENDER ORCHESTRATION
   ===================================================================== */
function render(opt = {}) {
  const v = $('#view'), y = v.scrollTop;
  v.innerHTML = VIEWS[state.tab]();
  v.scrollTop = opt.reset ? 0 : y;
  if (opt.reset) { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }
  syncChrome();
  animateCounts();
}
function syncChrome() {
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === state.tab)));
  const n = activeAlerts().length, b = $('#alertBadge');
  b.hidden = n === 0; b.textContent = n;
  $('#fab').hidden = !(state.tab === 'subs' && state.subs.length > 0);
}
function go(tab) { state.tab = tab; state.shown = {}; render({ reset:true }); }

// number count-up (from last shown value → new value)
function animateCounts() {
  $$('[data-count]').forEach(el => {
    const to = +el.dataset.count, key = el.dataset.key;
    const from = (key && state.lastShown[key] !== undefined) ? state.lastShown[key] : 0;
    if (key) state.lastShown[key] = to;
    if (reducedMotion || from === to) { el.textContent = fmtNum(to); return; }
    const t0 = performance.now(), dur = 650;
    const tick = now => {
      if (!el.isConnected) return;
      const k = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3);
      el.textContent = k < 1 ? fmtInt(from + (to - from) * e) : fmtNum(to);
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

let toastTimer;
function toast(msg, action, sprite) {
  const t = $('#toast');
  delete state.shown.toast;
  t.classList.toggle('rich', !!sprite);
  t.innerHTML = `${sprite ? `<span class="t-sprite">${mascot(sprite, { w:64, slot:'toast' })}</span>` : ''}<span>${msg}</span>${action ? `<button data-action="${action.act}">${action.label}</button>` : ''}`;
  t.classList.add('show');
