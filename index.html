  'set-plan': el => setPlan(el.dataset.v === 'premium'),
  upgrade: () => { closeSheet(); setPlan(true); },
  'toggle-reco-all': () => { state.recoAll = !state.recoAll; render(); },
  'toggle-need': el => { const sub = getSub(el.dataset.id), cur = (state.needs[sub.id] || DEFAULT_NEEDS[sub.cat]).slice(), k = el.dataset.v;
    const i = cur.indexOf(k); if (i >= 0) cur.splice(i, 1); else cur.push(k); state.needs[sub.id] = cur; render(); },
  'pick-compare': el => { state.compareSel = el.dataset.id; render(); },
  'pick-plan': el => { state.planSel = el.dataset.id; render(); },
  'offer-plan': el => openOffer('plan', el.dataset.id),
  'offer-alt': el => openOffer('alt', el.dataset.id, Number(el.dataset.alt)),
  'open-insight': el => { state.insightTab = el.dataset.v; go('insights'); },
  'reco-open': el => { const r = recoFor(getSub(el.dataset.id));
    if (r.kind === 'plan') { state.planSel = r.sub.id; state.insightTab = 'plans'; go('insights'); }
    else if (r.kind === 'alt') { state.compareSel = r.sub.id; state.insightTab = 'compare'; go('insights'); }
    else { state.insightTab = 'value'; go('insights'); openUsageSheet(r.sub.id); } },
  'toggle-hidden-deals': () => { state.showHiddenDeals = !state.showHiddenDeals; render(); },
  'filter-cat': el => { state.filter = el.dataset.v; state.query = ''; go('subs'); },

  /* home */
  tip: () => { state.tipIndex = state.tipIndex + 1 >= TIPS.length ? -1 : state.tipIndex + 1; updateBuddy(); },
  'set-lang': el => setLang(el.dataset.v),
  period: el => { state.period = el.dataset.v; render(); },
  'hide-banner': () => { state.trialBannerHidden = true; render(); },
  'reset-demo': () => {
    state.subs = seedSubs(); state.splits = seedSplits(); state.alertStatus = {};
    state.usage = seedUsage(); state.valueDismissed = {}; state.dealsHidden = {}; state.dealsSaved = {}; state.showHiddenDeals = false; state.needs = {}; state.compareSel = null; state.planSel = null; state.recoAll = false;
    state.trialBannerHidden = false; state.filter = 'all'; state.query = ''; state.splitSel = 'netflix'; state.lastShown = {};
    withLoading(() => { render({ reset:true }); toast(T('รีเซ็ตข้อมูลตัวอย่างแล้ว', 'Sample data reset')); }, 700);
  },
  'clear-all': () => { state.subs = []; state.splits = {}; state.alertStatus = {}; state.lastShown = {}; render(); toast(T('ลบทั้งหมดแล้ว — ลองดูหน้าว่างได้เลย', 'Everything deleted — check out the empty states')); },

  /* subscriptions */
  'set-filter': el => { state.filter = el.dataset.v; render(); },
  'clear-filter': () => { state.filter = 'all'; state.query = ''; render(); },
  'add-sub': () => openSubSheet(null),
  'edit-sub': el => openSubSheet(el.dataset.id),
  'set-cycle': el => { state.draft.cycle = el.dataset.v; refreshForm(); },
  'set-cat': el => { state.draft.cat = el.dataset.v; refreshForm(); },
  'toggle-trial': () => { state.draft.trial = !state.draft.trial; refreshForm(); },
  'toggle-shareable': () => { state.draft.shareable = !state.draft.shareable; refreshForm(); },
  'save-sub': () => saveSub(),
  'ask-delete': el => askDelete(el.dataset.id),
  'confirm-delete': el => deleteSub(el.dataset.id),
  'undo-delete': () => {
    const L = state.lastDeleted; if (!L) return;
    state.subs.splice(Math.min(L.index, state.subs.length), 0, L.sub);
    if (L.split) state.splits[L.sub.id] = L.split;
    state.lastDeleted = null; render(); toast(T(`กู้คืน ${esc(L.sub.name)} แล้ว`, `Restored ${esc(L.sub.name)}`));
  },
  'close-sheet': () => closeSheet(),
  'close-dialog': () => closeDialog(),

  /* alerts */
  'toggle-remind': () => { state.settings.remind = !state.settings.remind; render(); toast(state.settings.remind ? T('เปิดการแจ้งเตือนแล้ว', 'Reminders on') : T('ปิดการแจ้งเตือนแล้ว', 'Reminders off')); },
  'set-lead': el => { if (!state.settings.remind) return; state.settings.lead = +el.dataset.v; render(); },
  'cancel-guide': el => openCancelGuide(el.dataset.id),
  'cancelled-done': el => { const id = el.dataset.id; closeSheet(); deleteSub(id); },
  snooze: el => { state.alertStatus[el.dataset.key] = 'snoozed'; render(); toast(T('เลื่อนไปเตือนพรุ่งนี้', 'Snoozed until tomorrow'), { act:'undo-alert:' + el.dataset.key, label:T('เลิกทำ', 'Undo') }); },
  'alert-done': el => { state.alertStatus[el.dataset.key] = 'done'; render(); toast(T('ทำเครื่องหมายว่าเสร็จแล้ว ✓', 'Marked as done ✓')); },
  'restore-alert': el => { delete state.alertStatus[el.dataset.key]; render(); },

  /* split */
  'pick-split': el => { state.splitSel = el.dataset.id; render(); },
  'add-friend': () => openFriendSheet(),
  'save-friend': () => saveFriend(),
  'suggest-friend': el => { state.friendDraft.name = el.dataset.name; saveFriend(); },
  'toggle-paid': el => {
    const f = state.splits[state.splitSel].friends.find(x => x.id === el.dataset.id);
    f.paid = !f.paid; f.reminded = false; render();
    toast(f.paid ? T(`${esc(fname(f))} จ่ายแล้ว 🎉`, `${esc(fname(f))} paid 🎉`) : T(`${esc(fname(f))} ยังไม่จ่าย`, `${esc(fname(f))} is unpaid`), null, f.paid ? 'happy' : null);
  },
  remind: el => {
    const sub = getSub(state.splitSel), p = planStats(sub);
    const f = p.fr.find(x => x.id === el.dataset.id); f.reminded = true; render();
    toast(T(`ส่งข้อความเตือน ${esc(fname(f))} แล้ว (${fmtMoney(p.per)})`, `Reminder sent to ${esc(fname(f))} (${fmtMoney(p.per)})`));
  },
  'remind-all': () => {
    const p = planStats(getSub(state.splitSel));
    const list = p.fr.filter(f => !f.paid && !f.reminded); list.forEach(f => f.reminded = true);
    withLoading(() => { render(); toast(T(`ส่งข้อความเตือน ${list.length} คนแล้ว`, `Reminder sent to ${list.length} friend${list.length === 1 ? '' : 's'}`), null, 'wink'); }, 800, T('กำลังส่งข้อความเตือน…', 'Sending reminders…'));
  },
  'remove-friend': el => {
    const sp = state.splits[state.splitSel], i = sp.friends.findIndex(x => x.id === el.dataset.id);
    const [f] = sp.friends.splice(i, 1); state.lastFriend = { planId:state.splitSel, f, i };
    render(); toast(T(`ลบ ${esc(fname(f))} ออกจากแพลนแล้ว`, `Removed ${esc(fname(f))} from the plan`), { act:'undo-friend', label:T('เลิกทำ', 'Undo') });
  },
  'undo-friend': () => {
    const L = state.lastFriend; if (!L) return;
    (state.splits[L.planId] = state.splits[L.planId] || { friends:[] }).friends.splice(L.i, 0, L.f);
    state.lastFriend = null; render();
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const [name, arg] = el.dataset.action.split(':');
  if (name === 'undo-alert') { delete state.alertStatus[arg]; render(); return; }
  if (name === 'undo-flag')  { delete state.valueDismissed[arg]; render(); return; }
  if (name === 'undo-deal')  { delete state.dealsHidden[arg]; render(); return; }
  // submit buttons are handled by the form's submit event
  if (el.getAttribute('type') === 'submit') return;
  const fn = actions[name]; if (fn) fn(el, e);
});

// forms: Enter key / submit button
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'subForm') saveSub();
  if (e.target.id === 'friendForm') saveFriend();
  if (e.target.id === 'usageForm') saveUsage();
});

// live inputs
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.usage && state.usageDraft) { onUsageInput(t); return; }
  if (t.id === 'searchInput') { state.query = t.value; updateSubList(); return; }
  if (t.id === 'friendName' && state.friendDraft) {
    state.friendDraft.name = t.value;
    if (state.friendDraft.error) { state.friendDraft.error = ''; $('#err-friend').textContent = ''; t.classList.remove('invalid'); t.setAttribute('aria-invalid', 'false'); }
    return;
  }
  const f = t.dataset.field;
  if (f && state.draft) {
    state.draft[f] = t.value;
    if (state.draft.errors[f]) {
      delete state.draft.errors[f];
      const er = $('#err-' + f); if (er) er.textContent = '';
      t.classList.remove('invalid'); t.setAttribute('aria-invalid', 'false');
    }
    if (f === 'price' || f === 'trialEnd') {
      const h = $('#trialHint');
      if (h) { const p = parseFloat(state.draft.price); h.textContent = trialHint(p, state.draft.trialEnd); }
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#dialog').classList.contains('open')) closeDialog();
  else if ($('#sheet').classList.contains('open')) closeSheet();
});

/* =====================================================================
   10. BOOT
   ===================================================================== */
/* ---------- 10.1 MASCOT: sprites, tips, splash, loading ---------- */
// One slot per place a sprite appears; it bounces in only when the sprite in that slot changes.
function mascot(name, { w = 96, slot = name } = {}) {
  const changed = state.shown[slot] !== name;
  state.shown[slot] = name;
  return `<span class="mascot-wrap" style="--w:${w}px"><img class="mascot${changed ? ' pop' : ''}" src="${SPRITES[name]}" alt="" aria-hidden="true" draggable="false"></span>`;
}

const TIPS = [
  { sprite:'wink',       th:'แชร์แพลน Family กับเพื่อน จ่ายต่อคนถูกลงเกือบครึ่งเลยนะ!', en:'Share a Family plan with friends and everyone pays far less!' },
  { sprite:'thinking',   th:'ก่อนหมดช่วงทดลองฟรี ตั้งเตือนยกเลิกไว้ก่อน จะได้ไม่โดนตัดเงินโดยไม่รู้ตัว', en:"Set a cancel reminder before a free trial ends so you don't get charged by surprise." },
  { sprite:'reading',    th:'บริการที่จ่ายรายปีมักถูกกว่ารายเดือน ลองเทียบราคาก่อนต่ออายุดูนะ', en:'Yearly plans are often cheaper than monthly. Compare before you renew!' },
  { sprite:'determined', th:'ต้นเดือนนี้ ลองไล่ดูว่ามีบริการไหนที่ไม่ได้ใช้แล้ว ยกเลิกได้เลย!', en:"Start of the month: look for services you no longer use and cancel them!" },
  { sprite:'happy',      th:'หลายบริการมีแพลนนักศึกษาราคาพิเศษ ลองเช็กก่อนสมัครแบบปกติ', en:'Many services have special student plans. Check before paying full price.' },
  { sprite:'backpack',   th:'ตั้งเตือนล่วงหน้า 3 วัน จะมีเวลาคิดก่อนตัดสินใจยกเลิก', en:'Set reminders 3 days ahead so you have time to decide.' },
  { sprite:'thinking',   th:'ใช้ AI หลายตัวพร้อมกันอยู่ไหม? เลือกตัวที่ใช้บ่อยที่สุดไว้ตัวเดียวก็พอ', en:'Paying for several AI tools? Keep just the one you use most.' },
  { sprite:'laptop',     th:'เก็บเงินจากเพื่อนทันทีที่บิลตัด อย่าปล่อยให้ค้างนานนะ', en:"Collect from friends as soon as the bill hits. Don't let it pile up!" }
];
const buddyHint = () => '<small>' + T('แตะแมวเพื่อดูเคล็ดลับประหยัดเงิน 💡', 'Tap the cat for a money-saving tip 💡') + '</small>';
const buddyText = () => state.tipIndex >= 0
  ? esc(T(TIPS[state.tipIndex].th, TIPS[state.tipIndex].en))
  : T(`เดือนนี้คุณใช้ไป <b>฿${fmtInt(totals().total)}</b>`, `This month you spent <b>฿${fmtInt(totals().total)}</b>`);
const buddySprite = () => state.tipIndex >= 0 ? TIPS[state.tipIndex].sprite : 'waving';

function homeBuddy() {
  return `<div class="buddy">
    <button class="buddy-btn" data-action="tip" aria-label="${T('แตะเพื่อดูเคล็ดลับประหยัดเงินจากแมว Submate', 'Tap for a money-saving tip from the Submate cat')}">${mascot(buddySprite(), { w:94, slot:'home' })}</button>
    <div class="bubble" id="buddyBubble" aria-live="polite">${buddyText()}${buddyHint()}</div>
  </div>`;
}
// update in place (no full re-render) so the bounce-in is visible
function updateBuddy() {
  const img = $('.buddy-btn img'), bub = $('#buddyBubble');
  if (!img || !bub) return;
  const name = buddySprite();
  img.src = SPRITES[name]; state.shown.home = name;
  img.classList.remove('pop'); void img.offsetWidth; img.classList.add('pop');
  bub.innerHTML = buddyText() + buddyHint();
}

// thinking-cat loading overlay
let loadTimer;
function withLoading(fn, ms = 700, text = T('กำลังคิดแป๊บนึง…', 'Thinking for a sec…')) {
  const l = $('#loader');
  delete state.shown.loader;
  $('#loaderSprite').innerHTML = mascot('thinking', { w:112, slot:'loader' });
  $('#loaderText').textContent = text;
  l.classList.add('open'); l.setAttribute('aria-hidden', 'false');
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => { fn(); l.classList.remove('open'); l.setAttribute('aria-hidden', 'true'); }, ms);
}

// apply the language to static HTML (tab bar, aria labels, <title>, <html lang>)
function applyStatic() {
  document.documentElement.lang = state.lang;
  document.title = T('SUBMATE — จัดการค่าสมัครสมาชิก', 'SUBMATE — subscription manager');
  $$('[data-i18n]').forEach(el => { const [th, en] = el.dataset.i18n.split('|'); el.textContent = state.lang === 'en' ? en : th; });
  $$('[data-i18n-aria]').forEach(el => { const [th, en] = el.dataset.i18nAria.split('|'); el.setAttribute('aria-label', state.lang === 'en' ? en : th); });
}
function setLang(v) {
  if (v === state.lang) return;
  state.lang = v; applyStatic(); render();
  toast(T('เปลี่ยนเป็นภาษาไทยแล้ว', 'Switched to English'));
}

// scale the phone frame down on short desktop windows
function fit() {
  const st = $('#stage');
  if (innerWidth <= 500) { st.style.setProperty('--scale', 1); return; }
  st.style.setProperty('--scale', Math.min(1, (innerHeight - 40) / 844).toFixed(3));
}
addEventListener('resize', fit); fit();

applyStatic();
render({ reset:true });
})();
</script>
